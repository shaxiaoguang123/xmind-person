name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'

permissions:
  contents: write

jobs:
  t03-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Architecture boundaries
        run: npm run architecture:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Start Vite dev server
        run: |
          npm run dev --workspace @xmind-person/web > /tmp/t03-vite.log 2>&1 &
          echo $! > /tmp/t03-vite.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/t03-vite.log
          exit 1
      - name: Browser QA
        run: npm run browser:qa
      - name: Download verified implementation-head evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/t03-heading-markdown-cards'
        uses: actions/download-artifact@v4
        with:
          name: t03-browser-qa
          path: /tmp/t03-implementation-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34117231444
      - name: Commit verified T03 screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/t03-heading-markdown-cards'
        run: |
          mkdir -p docs/screenshots
          cp /tmp/t03-implementation-evidence/mixed-cards.png docs/screenshots/t03-mixed-cards.png
          cp /tmp/t03-implementation-evidence/gfm-card.png docs/screenshots/t03-gfm-card.png
          cp /tmp/t03-implementation-evidence/long-card.png docs/screenshots/t03-long-card.png
          cp /tmp/t03-implementation-evidence/empty-card.png docs/screenshots/t03-empty-card.png
          git add docs/screenshots/t03-mixed-cards.png docs/screenshots/t03-gfm-card.png docs/screenshots/t03-long-card.png docs/screenshots/t03-empty-card.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(t03): add browser screenshot evidence'
          git push origin HEAD:feat/t03-heading-markdown-cards
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-browser-qa
          path: artifacts/t03-browser
          if-no-files-found: warn
